<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body>
         
    <div class="w-[100vw] h-[100vh]  flex flex-col items-center justify-center bg-[#344151] gap-10">
        <!-- inside box -->
        
        <div>

           <div class="text-[#0398d4] font-medium text-[20px]">Increment And Decrement </div>

           <div class="bg-white flex text-[25px] text-[#344151] rounded-sm gap-12 p-3 px-5">
            <!-- minus button -->
            <button id="decrement" onclick="dec()" class="border-r-2 border-[#bfbfbf] pr-5">
                <i class="fa-solid fa-minus"></i>
            </button>

            <!-- value -->

            <div id="counterValue"> 0 </div>

            <!-- plus button -->
             <button id="increment" onclick="inc()" class="border-l-2 border-[#bfbfbf] pl-5">
                <i class="fa-solid fa-plus"></i>
             </button>



           </div>
          

        </div>










     </div>




    <script src="https://kit.fontawesome.com/dd9f441a8d.js" crossorigin="anonymous"></script>
    <script src="./index.js"></script>
</body>
</html>
